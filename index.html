<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IST Clock</title>
    <style>
      :root {
        --bg-start: #0f172a;
        --bg-end: #1d4ed8;
        --card-bg: rgba(255, 255, 255, 0.15);
        --text: #f8fafc;
        --muted: #dbeafe;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
        overflow: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        inset: -20%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.25), transparent 60%);
        filter: blur(40px);
        animation: float 8s ease-in-out infinite alternate;
      }

      .clock-card {
        position: relative;
        z-index: 1;
        width: min(92vw, 540px);
        padding: 2rem;
        border-radius: 24px;
        background: var(--card-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 20px 45px rgba(2, 6, 23, 0.35);
        text-align: center;
        transform: translateY(0);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .clock-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 0.8rem;
        padding: 0.4rem 0.8rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .clock-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        margin: 1rem 0;
      }

      .clock-box {
        padding: 1rem;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }

      .clock-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--muted);
        margin-bottom: 0.4rem;
      }

      .time {
        font-size: clamp(1.3rem, 3vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-bottom: 0.2rem;
      }

      .date {
        font-size: 0.95rem;
        color: var(--muted);
        margin-bottom: 0.8rem;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.95rem;
        color: #e0f2fe;
      }

      .status::before {
        content: "";
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
        animation: pulse 1.8s infinite;
      }

      @keyframes float {
        from { transform: translate3d(-5%, -3%, 0); }
        to { transform: translate3d(5%, 3%, 0); }
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
        100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
      }
    </style>
  </head>
  <body>
    <main class="clock-card">
      <p class="eyebrow">Live World Clocks</p>
      <div class="clock-grid">
        <div class="clock-box">
          <p class="clock-label">IST</p>
          <h1 id="ist-time" class="time">--:--:--</h1>
          <p id="ist-date" class="date">Loading date...</p>
        </div>
        <div class="clock-box">
          <p class="clock-label">GMT</p>
          <h1 id="gmt-time" class="time">--:--:--</h1>
          <p id="gmt-date" class="date">Loading date...</p>
        </div>
      </div>
      <p class="status">Asia/Kolkata • GMT</p>
    </main>

    <script>
      const istTimeEl = document.getElementById("ist-time");
      const istDateEl = document.getElementById("ist-date");
      const gmtTimeEl = document.getElementById("gmt-time");
      const gmtDateEl = document.getElementById("gmt-date");

      function updateClock() {
        const now = new Date();

        const formatTime = (timeZone) =>
          new Intl.DateTimeFormat("en-GB", {
            timeZone,
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true,
          }).format(now);

        const formatDate = (timeZone) =>
          new Intl.DateTimeFormat("en-GB", {
            timeZone,
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric",
          }).format(now);

        istTimeEl.textContent = formatTime("Asia/Kolkata");
        istDateEl.textContent = formatDate("Asia/Kolkata");
        gmtTimeEl.textContent = formatTime("Etc/GMT");
        gmtDateEl.textContent = formatDate("Etc/GMT");
      }

      updateClock();
      setInterval(updateClock, 1000);
    </script>
  </body>
</html>
